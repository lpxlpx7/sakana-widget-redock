<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sakana! Widget ReDock</title>
    <meta name="description" content="A movable and minimizable dock for Sakana! Widget." />
    <link rel="stylesheet" href="../lib/index.min.css" />
    <style>
      body {
        min-height: 160vh;
        margin: 0;
        padding: 8vw;
        background: #f3f3f3;
        color: #111;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          Arial,
          sans-serif;
      }
      h1 {
        max-width: 800px;
        margin: 0;
        font-size: clamp(54px, 9vw, 130px);
        letter-spacing: -0.07em;
        line-height: 0.88;
      }
      p {
        max-width: 560px;
        margin-top: 36px;
        font-size: 20px;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Sakana! Widget ReDock</h1>
    <p>
      Hover the character and drag the top handle to move the dock. Click the stand to switch
      characters. Use the minus button to minimize it into a chip, then click the chip to restore
      it.
    </p>
    <p>
      <a href="https://github.com/lpxlpx7/sakana-widget-redock">GitHub</a>
      ·
      <a href="https://github.com/dsrkafuu/sakana-widget">Sakana! Widget</a>
    </p>

    <script>
      function initSakanaReDock() {
        SakanaReDock.mount();
      }
    </script>
    <script async onload="initSakanaReDock()" src="../lib/index.umd.js"></script>
  </body>
</html>
